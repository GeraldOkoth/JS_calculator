<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./calculator.css" />
    <script type="module" src="calculator.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="title">
        <span class="identity">CASIO</span>
        <span class="identity">fx-991</span>
      </div>
      <div class="upper">
        <input type="text" name="expression" id="expression" readonly />
        <span class="results"></span>
      </div>
      <div class="lower">
        <div class="operators">
          <button class="btn operator" data-value="+">+</button>
          <button class="btn operator" data-value="-">-</button>
          <button class="btn operator" data-value="*">*</button>
          <button class="btn operator" data-value="/">/</button>
          <button class="btn function equal-btn" data-value="=">=</button>
        </div>
        <div class="switch-btn-txt">
          <span class="switch">switch</span>
          <span class="switch"><img src="./icons/swap.svg" alt="" /></span>
        </div>
        <div class="numerics">
          <button class="btn numeric" data-value="9">9</button>
          <button class="btn numeric" data-value="8">8</button>
          <button class="btn numeric" data-value="7">7</button>
          <button class="btn numeric" data-value="6">6</button>
          <button class="btn numeric" data-value="5">5</button>
          <button class="btn numeric" data-value="4">4</button>
          <button class="btn numeric" data-value="3">3</button>
          <button class="btn numeric" data-value="2">2</button>
          <button class="btn numeric" data-value="1">1</button>
          <button class="btn numeric" data-value="0">0</button>
          <button class="btn numeric" data-value=".">.</button>
          <button class="btn numeric" data-value="(">(</button>
          <button class="btn numeric" data-value=")">)</button>
          <button
            class="btn numeric"
            data-value="deg"
            onclick="alert('This feature is coming soon!')"
          >
            deg
          </button>
          <button
            class="btn numeric"
            data-value="rad"
            onclick="alert('This feature is coming soon!')"
          >
            rad
          </button>
          <button
            class="btn numeric"
            data-value="sin"
            onclick="alert('This feature is coming soon!')"
          >
            sin
          </button>
          <button
            class="btn numeric"
            data-value="cos"
            onclick="alert('This feature is coming soon!')"
          >
            cos
          </button>
          <button
            class="btn numeric"
            data-value="tan"
            onclick="alert('This feature is coming soon!')"
          >
            tan
          </button>
          <button
            class="btn numeric"
            data-value="sec"
            onclick="alert('This feature is coming soon!')"
          >
            sec
          </button>
          <button
            class="btn numeric"
            data-value="csc"
            onclick="alert('This feature is coming soon!')"
          >
            csc
          </button>
          <button
            class="btn numeric"
            data-value="cot"
            onclick="alert('This feature is coming soon!')"
          >
            cot
          </button>
          <button
            class="btn numeric"
            data-value="ln"
            onclick="alert('This feature is coming soon!')"
          >
            ln
          </button>
          <button
            class="btn numeric"
            data-value="log"
            onclick="alert('This feature is coming soon!')"
          >
            log
          </button>
          <button
            class="btn numeric"
            data-value="sqrt"
            onclick="alert('This feature is coming soon!')"
          >
            √
          </button>
          <button
            class="btn numeric"
            data-value="^"
            onclick="alert('This feature is coming soon!')"
          >
            ^
          </button>
          <button
            class="btn numeric pi"
            data-value="pi"
          >
            π
          </button>
          <button
            class="btn numeric"
            data-value="e"
            onclick="alert('This feature is coming soon!')"
          >
            e
          </button>
        </div>
        <div class="functions">
          <button class="btn clear-function" data-value="c">AC</button>
          <button
            class="btn delete-function"
            data-value="D"
          >
            DEL
          </button>
          <button class="btn answer-function" data-value="a">ANS</button>
        </div>
      </div>
    </div>
  </body>
</html>
