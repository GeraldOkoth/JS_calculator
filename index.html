<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./calculator.css" />
    <script type="module" src="calculator.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="calc-brand">
        <span class="identity">CASIO</span>
        <span class="identity">fx-991</span>
      </div>
      <div class="calc-upper">
        <span id="angle_Mode">Mode</span>
        <input
          type="text"
          name="input-expression"
          id="input-expression"
          readonly
        />
        <span class="results"></span>
      </div>
      <div class="icons">
        <span class="switch-btn">
          <span class="switch-text">switch</span>
          <span class="switch-icon"
            ><img src="./icons/swap.svg" alt="switch-button"
          /></span>
        </span>
        <span class="chat-overlay"><img src="./icons/more_horiz.svg" /></span>
      </div>
      <div class="calc-lower">
        <div class="functions">
          <div class="operators">
            <button class="btn operator" data-value="+">+</button>
            <button class="btn operator" data-value="-">-</button>
            <button class="btn operator" data-value="*">*</button>
            <button class="btn operator" data-value="/">/</button>
            <button class="btn function equal-btn" data-value="=">=</button>
          </div>
          <div class="special-operations">
            <button class="btn clear-function" data-value="c">AC</button>
            <button class="btn delete-function" data-value="D">DEL</button>
            <button class="btn answer-function" data-value="a">ANS</button>
          </div>
        </div>
        <div class="numerics">
          <button class="btn numeric" data-value="9">9</button>
          <button class="btn numeric" data-value="8">8</button>
          <button class="btn numeric" data-value="7">7</button>
          <button class="btn numeric" data-value="6">6</button>
          <button class="btn numeric" data-value="5">5</button>
          <button class="btn numeric" data-value="4">4</button>
          <button class="btn numeric" data-value="3">3</button>
          <button class="btn numeric" data-value="2">2</button>
          <button class="btn numeric" data-value="1">1</button>
          <button class="btn numeric" data-value="0">0</button>
          <button class="btn numeric" data-value=".">.</button>
          <button class="btn numeric" data-value="(">(</button>
          <button class="btn numeric" data-value=")">)</button>
          <button class="btn numeric" data-value="deg">deg</button>
          <button class="btn numeric" data-value="rad">rad</button>
          <button class="btn numeric" data-value="sin">sin</button>
          <button class="btn numeric" data-value="cos">cos</button>
          <button class="btn numeric" data-value="tan">tan</button>
          <button class="btn numeric" data-value="sec">sec</button>
          <button class="btn numeric" data-value="csc">csc</button>
          <button class="btn numeric" data-value="cot">cot</button>
          <button class="btn numeric" data-value="ln">ln</button>
          <button class="btn numeric" data-value="log">log</button>
          <button class="btn numeric" data-value="sqrt">√</button>
          <button class="btn numeric" data-value="^">^</button>
          <button class="btn numeric pi" data-value="pi">π</button>
          <button class="btn numeric" data-value="e">e</button>
        </div>
        <div class="chat-box">
          <p>Ask AI to solve any mathematical task</p>
          <div class="chat-message">
            <p id="para">
              This is a text template, AI feature is in development.
            </p>
          </div>
          <div class="input-submit">
            <input
              type="text"
              placeholder="Chat with AI"
              name="aichat"
              id="aichat"
            />
            <button type="submit" class="btn-submit">
              <img src="./icons/send.svg" alt="submit AI chat button" />
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
